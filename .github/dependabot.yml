# Dependabot (gratis): PR semanales con dependencias al día. Las de seguridad llegan aparte, en cuanto hay aviso.
# El lunes, el workflow "Vigilancia" resume por Telegram los PR de Dependabot abiertos.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Madrid }
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    commit-message: { prefix: "deps" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Europe/Madrid }
    open-pull-requests-limit: 3
    commit-message: { prefix: "deps(actions)" }
