name: Kimiko Cloud

on:
  schedule:
    - cron: "0 */4 * * *"   # cada 4h
  workflow_dispatch:

concurrency:
  group: kimiko
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # watchdog equivalente
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kimiko — ciclo completo
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: kimiko/PROMPT.md
          claude_args: "--dangerously-skip-permissions"
        env:
          SUPABASE_URL: https://vctetjugbvyllwjpxcxh.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Commit bitácora y memoria
        run: |
          git config user.name "kimiko-bot"
          git config user.email "kimiko@quantum-holistic.com"
          git add kimiko/bitacora/ KIMIKO_MEMORIA.md || true
          git diff --cached --quiet || git commit -m "kimiko: bitácora ciclo $(date -u +%Y-%m-%d-%H%M)"
          git push
